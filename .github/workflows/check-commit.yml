name: "🔎 Check: 'baproto-gdscript' plugin"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      has_gdscript_change: "${{ steps.check-godot-source.outputs.any_modified == 'true' }}"
      has_rust_change: "${{ steps.check-rust-source.outputs.any_modified == 'true' }}"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Check for any non-source code changes
        id: check-godot-source
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
        with:
          exclude_submodules: true
          files: "**/*.gd"

      - name: Check for any non-source code changes
        id: check-rust-source
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
        with:
          files: |
            **/*.rs
            **/Cargo.*

  check-godot:
    needs: ["changes"]
    uses: "./.github/workflows/check-commit-godot.yml"
    secrets: inherit
    with:
      has_source_change: ${{ fromJson(needs.changes.outputs.has_gdscript_change) }}

  check-rust:
    needs: ["changes"]
    uses: "./.github/workflows/check-commit-rust.yml"
    secrets: inherit
    with:
      has_source_change: ${{ fromJson(needs.changes.outputs.has_rust_change) }}

  # Used to ensure all branch protection requirements are met. This is a workaround until
  # https://github.com/github-community/community/discussions/4324 is addressed.
  branch_protection:
    needs: ["check-godot", "check-rust"]
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Verify status of dependencies
        if: |
          always() &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
